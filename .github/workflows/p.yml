name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://hania360-home.lior-hania.workers.dev"
          echo "TEAM $(curl -s "$B/api/sport/team?id=10181&app=sport" | head -c 700)"
          echo "LEAD $(curl -s "$B/api/sport/il?app=sport" | grep -o '"leaders".*' | head -c 400)"
          echo "NEWS $(curl -s https://hania360.com/api/sport/news | head -c 400)"
          for u in https://cart.hania360.com/ https://go.hania360.com/ https://save.hania360.com/; do echo "CHK $u $(curl -s $u | grep -c 'h360_i')"; done
