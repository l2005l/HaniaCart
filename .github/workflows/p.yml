name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for u in https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip https://gtfs.mot.gov.il/gtfsfiles/ https://www.rail.co.il/ https://rail.co.il/ https://israelrail.azurefd.net/rjpa-prod/api/v1/timetable/searchTrainLuzForDateTime; do echo "R $u $(curl -s -o /dev/null -I -L --max-time 30 -w '%{http_code} %{size_download} %{content_type}' $u)"; done
          curl -sI --max-time 30 https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip | grep -i "content-length\|last-modified" | sed 's/^/R /'
