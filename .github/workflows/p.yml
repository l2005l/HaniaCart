name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in haktava kufsa; do echo "APP $h $(curl -s -o /dev/null -w '%{http_code}' https://$h.hania360.com/) $(curl -s https://$h.hania360.com/ | grep -o '<title>[^<]*' | head -1)"; done
          echo "APP plan $(curl -s -X POST https://haktava.hania360.com/api/haktava/plan -H 'content-type: application/json' -d '{"text":"היום למדנו את האות ש עם חיריק. מילים: שיר, שיש"}')"
