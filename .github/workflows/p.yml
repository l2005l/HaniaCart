    steps:
      - shell: bash {0}
        run: |
          curl -s https://tv.hania360.com/ | grep -o 'עכשיו בשידור' | head -1 | sed 's/^/R /'
          for u in https://www.kan.org.il/live/ https://www.mako.co.il/mako-vod-live-tv/VOD-6540b8dcb64fd31006.htm https://13tv.co.il/live/ https://www.now14.co.il/live/ https://www.knesset.tv/; do echo "X $u $(curl -sI -L -A 'Mozilla/5.0 Chrome/124' $u | grep -i 'x-frame-options\|frame-ancestors' | tr -d '\r' | tr '\n' ' ' | cut -c1-150)"; done
