    steps:
      - run: |
          for h in regatov.hania360.com rega.hania360.com chag.hania360.com; do echo "$h $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://$h/) title=$(curl -sL https://$h/ | grep -o '<title>[^<]*' | head -1)"; done
          echo "visits-code $(curl -s https://regatov.hania360.com/ | grep -c 'מי מגיע לבקר')"
