name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          mkdir -p out
          Q='[out:json][timeout:120];(way["highway"](32.0600,34.7640,32.0820,34.7860);way["building"](32.0600,34.7640,32.0820,34.7860);way["leisure"](32.0600,34.7640,32.0820,34.7860);way["landuse"](32.0600,34.7640,32.0820,34.7860);way["natural"](32.0560,34.7560,32.0860,34.7900);way["amenity"~"parking|school|hospital|fuel|fire_station|marketplace"](32.0600,34.7640,32.0820,34.7860););out tags geom;node["highway"~"traffic_signals|stop|give_way|crossing|bus_stop|street_lamp"](32.0600,34.7640,32.0820,34.7860);out;node["natural"="tree"](32.0600,34.7640,32.0820,34.7860);out;node["amenity"~"hospital|fire_station|fuel|cafe|restaurant|pharmacy|school|kindergarten|post_office|bank"](32.0600,34.7640,32.0820,34.7860);out;node["shop"](32.0600,34.7640,32.0820,34.7860);out;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            curl -s -A "HaniaRace city map (hania360.com)" --data-urlencode "data=$Q" "$u" -o out/ta.json -w "R $u %{http_code} %{size_download}\n"
            head -c 200 out/ta.json | grep -q '"elements"' && break
          done
          echo "R head $(head -c 300 out/ta.json)"
          python3 -c "import json;d=json.load(open('out/ta.json'));from collections import Counter;print('R count',len(d['elements']),Counter(e['type'] for e in d['elements']))"
      - uses: actions/upload-artifact@v4
        with:
          name: osm
          path: out/
