name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://smart.hania360.com/; do
            c=$(curl -s -D /tmp/h -o /tmp/b -w "%{http_code}" "$u?v=$RANDOM"); echo "Z R $u $c $(grep -i '^content-security-policy' /tmp/h | tr -d '\r')"
            echo "Z R  hot:$(grep -c "מכמה מעלות זה יום חם" /tmp/b) fc:$(grep -c "get_forecasts" /tmp/b)"
          done
