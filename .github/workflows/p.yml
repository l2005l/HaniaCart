name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          H=$(curl -s https://hania360.com/)
          echo "R home bytes=$(echo "$H" | wc -c) dial=$(echo "$H" | grep -c 'id="dial"') ld=$(echo "$H" | grep -o 'application/ld+json' | wc -l) title=$(echo "$H" | grep -o '<title>[^<]*' | head -1)"
          echo "R og $(echo "$H" | grep -o 'og:image" content="[^"]*' | head -2 | tr '\n' ' ')"
          echo "R llms $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://hania360.com/llms.txt)"
          echo "R signin-cross $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'origin: https://evil.com' -H 'content-type: application/json' --data '{"email":"a@b.co"}' https://hania360.com/api/home/signin)"
          echo "R signin-bad $(curl -s -X POST -H 'origin: https://hania360.com' -H 'content-type: application/json' --data '{"email":"nope"}' https://hania360.com/api/home/signin)"
          echo "R classic $(curl -s https://hania360.com/classic | grep -c 'id="dial"') about=$(curl -s https://hania360.com/about | grep -c 'מסביב לשעון')"
          echo "R ogimg $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://hania360.com/og/home.jpg)"
