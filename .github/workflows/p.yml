name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for h in sky shana frame party globe eretz; do echo "R $h $(curl -s -o /dev/null -w '%{http_code}' https://$h.hania360.com/)"; done
          echo "R framenew $(curl -s -X POST -H 'content-type: application/json' -d '{"name":"probe"}' https://frame.hania360.com/api/frame/new | cut -c1-30)"
          echo "R partynew $(curl -s -X POST https://party.hania360.com/api/party/new | cut -c1-20)"
