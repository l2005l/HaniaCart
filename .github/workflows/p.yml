name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          echo "R old-sky $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://shamayim.hania360.com/)"
          echo "R old-shana $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://hania360.com/shana)"
          for h in sky shana; do echo "R $h $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://$h.hania360.com/)"; done
          echo "R tle $(curl -s -o /dev/null -w '%{http_code}' https://sky.hania360.com/api/sky/tle) year $(curl -s -o /dev/null -w '%{http_code}' https://shana.hania360.com/api/year)"
