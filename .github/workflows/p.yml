name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for h in frame party globe eretz sky shana layla; do echo "R $h $(curl -s https://$h.hania360.com/ | grep -o '<title>[^<]*' | head -1)"; done
          echo "R globejs $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://globe.hania360.com/globe.js)"
          echo "R qr $(curl -s -o /dev/null -w '%{http_code}' https://party.hania360.com/qrcode.js) $(curl -s -o /dev/null -w '%{http_code}' https://frame.hania360.com/qrcode.js)"
