name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://www.sefaria.org/api/calendars?timezone=Asia/Jerusalem&diaspora=0" | python3 -c "import json,sys;d=json.load(sys.stdin);[print('CAL',i['title']['en'],'|',i['displayValue'].get('he'),'|',i['ref'],'|',i.get('url')) for i in d['calendar_items']]"
          REF=$(curl -s "https://www.sefaria.org/api/calendars?timezone=Asia/Jerusalem" | python3 -c "import json,sys;d=json.load(sys.stdin);print([i['url'] for i in d['calendar_items'] if i['title']['en']=='Daf Yomi'][0])")
          echo "REF $REF"
          curl -s "https://www.sefaria.org/api/texts/versions/$REF" | python3 -c "import json,sys;d=json.load(sys.stdin);[print('VER',v.get('language'),'|',v.get('versionTitle'),'|',v.get('license'),'|',v.get('actualLanguage')) for v in d]"
          curl -s "https://www.sefaria.org/api/v3/texts/$REF?version=hebrew&version=english&return_format=text_only" | python3 -c "import json,sys;d=json.load(sys.stdin);print('KEYS',list(d.keys()));[print('V3',v.get('versionTitle'),v.get('license'),str(v.get('text'))[:300]) for v in d.get('versions',[])]"
          curl -s "https://www.sefaria.org/api/v3/texts/$REF?version=hebrew%7CWilliam%20Davidson%20Edition%20-%20Vocalized%20Aramaic&version=hebrew%7CWilliam%20Davidson%20Edition%20-%20Vocalized%20Punctuated%20Aramaic&return_format=text_only" | head -c 600; echo
          curl -s "https://www.sefaria.org/api/related/$REF" | python3 -c "import json,sys;d=json.load(sys.stdin);import collections;c=collections.Counter(l.get('collectiveTitle',{}).get('en') for l in d.get('links',[]));print('LINKS',c.most_common(15))"
          H=$(curl -s "https://www.sefaria.org/api/calendars?timezone=Asia/Jerusalem" | python3 -c "import json,sys;d=json.load(sys.stdin);print([i['url'] for i in d['calendar_items'] if 'Halakh' in i['title']['en']][0])")
          echo "HAL $H"
          curl -s "https://www.sefaria.org/api/v3/texts/$H?version=hebrew&return_format=text_only" | python3 -c "import json,sys;d=json.load(sys.stdin);[print('HV',v.get('versionTitle'),v.get('license'),str(v.get('text'))[:400]) for v in d.get('versions',[])]"
