name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 120 -X POST https://kita.hania360.com/api/kita/sheet -H 'content-type: application/json' -d '{"device":"probeDeviceKita12345","grade":"ה","subject":"math","topic":"כפל במאונך","level":"mid","type":"mix","n":12}' > s.json
          python3 -c "
          import json; j=json.load(open('s.json'))
          print('OUT', j.get('error'), j.get('v'), j.get('title'), '|', j.get('goal'))
          print('OUT ex', j.get('example'))
          for s in j.get('sections',[]):
            print('OUT SEC', s['name'], '|', s['ins'])
            for q in s['questions']: print('OUT   ', q['type'], '|', q['q'][:90], '=>', q['answer'][:60])
          "
