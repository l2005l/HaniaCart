name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          echo "R sky $(curl -s -o /dev/null -w '%{http_code}' https://shamayim.hania360.com/)"
          echo "R tle $(curl -s https://shamayim.hania360.com/api/sky/tle | head -3)"
          echo "R celestrak $(curl -s 'https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE' | head -2)"
          echo "R skyjs $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://shamayim.hania360.com/sky.js)"
