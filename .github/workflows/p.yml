name: p
on: push
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: got
          run-id: 45268548075
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - shell: bash
        run: |
          mkdir -p city && cp got/*/*.json city/ && ls -la city | sed 's/^/R /'
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git checkout --orphan osm-out && git rm -rq --cached . && git add city && git commit -qm "city maps (© OpenStreetMap contributors, ODbL)" && git push -f origin osm-out
