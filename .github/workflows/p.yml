name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in icon-192.png icon-512.png apple-180.png; do echo "IC $f $(curl -s https://sport.hania360.com/icons/$f | md5sum | cut -c1-8) $(curl -sI https://sport.hania360.com/icons/$f | grep -i 'cache-control\|cf-cache' | tr -d '\r' | tr '\n' ' ')"; done
