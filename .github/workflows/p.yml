name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H="https://hania360-home.lior-hania.workers.dev"
          echo PAGE $(curl -s -o /dev/null -w "%{http_code}" "$H/?app=fit") $(curl -s "$H/?app=fit" | grep -o 'HaniaFit\|FIT_EX' | sort -u | tr '\n' ' ')
          echo HEB $(curl -s -o /dev/null -w "%{http_code}" "$H/hebcal.js?app=fit")
          echo KEY $(curl -s "$H/api/shabbat/key?app=fit" | head -c 60)
          echo DOM $(curl -s -o /dev/null -w "%{http_code}" https://fit.hania360.com/)
