name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          V=$(curl -s https://race.hania360.com/game.js?v=x | grep -o 'CITY_V = "[a-f0-9]*"' | head -1)
          echo "R page city=$(curl -s https://race.hania360.com/ | grep -c 'mCity') $V"
          for c in tel-aviv netivot jerusalem haifa; do echo "R $c $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://race.hania360.com/city/$c.json?v=1)"; done
