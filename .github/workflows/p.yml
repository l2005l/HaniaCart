name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          echo "R shana $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://hania360.com/shana)"
          echo "R year $(curl -s -w ' %{http_code}' https://hania360.com/api/year)"
          echo "R layla $(curl -s -o /dev/null -w '%{http_code}' https://layla.hania360.com/) sky $(curl -s -o /dev/null -w '%{http_code}' https://shamayim.hania360.com/)"
          echo "R kids $(curl -s https://kids.hania360.com/ | grep -c 'layla')"
          echo "R shigra $(curl -s https://shigra.hania360.com/ | grep -c 'layla.hania360.com')"
