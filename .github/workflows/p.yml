name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H=https://fit.hania360.com
          echo PAGE $(curl -s -o /dev/null -w "%{http_code}" $H/) $(curl -s $H/ | grep -o 'HaniaFit\|FIT_EX' | sort -u | tr '\n' ' ')
          echo ICON $(curl -sL -o /dev/null -w "%{http_code} %{content_type}" $H/icons/icon-192.png)
          echo HEB $(curl -sL -o /dev/null -w "%{http_code} %{content_type}" $H/hebcal.js)
          echo SW $(curl -s -o /dev/null -w "%{http_code}" $H/sw.js) MAN $(curl -s -o /dev/null -w "%{http_code}" $H/manifest.webmanifest)
          echo KEY $(curl -s $H/api/shabbat/key | head -c 40)
