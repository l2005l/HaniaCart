name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://today.hania360.com/ -o t.html -D h.txt
          echo "TODAY $(grep -c 'nowCard' t.html) $(grep -c 'Secular' t.html) $(grep -c 'HaniaSport' t.html)"
          echo "CSP $(grep -i content-security h.txt | grep -o 'connect-src[^;]*;')"
          echo "CSS $(curl -s https://today.hania360.com/today.css | grep -c nowItem)"
          echo "FEED $(curl -s https://hania360.com/api/now/feed | head -c 200)"
