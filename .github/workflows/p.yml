name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "M $(curl -s https://hania360.com/manifest.webmanifest | head -c 120)"
          echo "S $(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://hania360.com/sw.js)"
          echo "I $(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://hania360.com/icons/icon-512.png)"
          echo "H $(curl -s https://hania360.com/ | grep -c 'hInstBtn')"
