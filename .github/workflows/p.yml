name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for h in layla.hania360.com shigra.hania360.com hania360.com; do echo "R $h fonts=$(curl -s https://$h/ | grep -c "media=\"print\" onload") err=$(curl -s https://$h/ | grep -c 's("err",m)')"; done
          echo "R stat $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'user-agent: Mozilla/5.0 (Linux; Android 14) Chrome/130' --data '{"e":"err","m":"probe: ignore @1:1"}' https://layla.hania360.com/api/stat)"
