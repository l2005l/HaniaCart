name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://hania360.com/ -o h.html; echo "home $(grep -c 'nowMeBtn' h.html) $(grep -c 'h360pref' h.html)"
          echo "euro $(curl -s -o /dev/null -w '%{http_code}' https://hania360.com/api/sport/euro)"
          curl -s https://dat.hania360.com/ | grep -c 'h360pref' | sed 's/^/dat /'
          curl -s https://cart.hania360.com/ | grep -c 'h360_i' | sed 's/^/cart /'
          curl -s https://hania360.com/privacy | grep -c 'h360_i' | sed 's/^/privacy /'
