name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -D /tmp/h -o /tmp/b "https://smart.hania360.com/?v=$RANDOM"; v=$(curl -s "https://smart.hania360.com/ver?v=$RANDOM")
          echo "Z R ver=$v page=$(grep -o 'data-ver="[0-9a-f]*"' /tmp/b) hot=$(grep -c 'מכמה מעלות זה יום חם' /tmp/b) $(grep -i '^cache-control' /tmp/h | tr -d '\r')"
