name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo LIVE $(curl -s https://hania360.com/api/live | head -c 600)
          echo HOME $(curl -s https://hania360.com/ | grep -o 'm26-w\|id="live"\|n26-more' | sort | uniq -c | tr '\n' ' ')
          echo CLASSIC $(curl -s https://hania360.com/classic | grep -c 'id="toolTabs"')
