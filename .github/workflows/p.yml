name: p
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          echo "R / $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://ai.hania360.com/)"
          echo "R manifest $(curl -s -o /dev/null -w '%{http_code}' https://ai.hania360.com/manifest.webmanifest)"
          echo "R icon $(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://ai.hania360.com/icons/icon-192.png)"
          echo "R api $(curl -s -o /dev/null -w '%{http_code}' -X POST https://ai.hania360.com/api/ai/chat)"
