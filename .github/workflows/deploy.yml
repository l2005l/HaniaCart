name: Test and deploy HaniaCart
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/*.test.mjs
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Stop if the Cloudflare secrets are missing
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install --no-audit --no-fund
      - name: Find or create the D1 database
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="haniacart") | .uuid')
          if [ -z "$id" ]; then npx wrangler d1 create haniacart; id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="haniacart") | .uuid'); fi
          test -n "$id"
          sed -i "s/REPLACED_BY_DEPLOY/$id/" wrangler.jsonc
      - run: npx wrangler d1 migrations apply haniacart --remote
      - run: npx wrangler deploy
