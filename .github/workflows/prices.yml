name: Nightly store prices
on:
  schedule:
    - cron: '30 2 * * *'   # 05:30 in Israel, after the chains publish their daily full files
  workflow_dispatch:
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Point wrangler at the database
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="haniacart") | .uuid')
          test -n "$id"
          sed -i "s/REPLACED_BY_DEPLOY/$id/" wrangler.jsonc
      - name: Read the branches households picked, and the towns already located
        run: |
          npx wrangler d1 execute haniacart --remote --json --command "SELECT sids FROM hh_stores" > wanted.json || echo '[]' > wanted.json
          npx wrangler d1 execute haniacart --remote --json --command "SELECT city, lat, lon FROM places" > places.json || echo '[]' > places.json
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install 'israeli-prices==0.2.*'
      - name: Download branches and price files
        run: python prices/fetch.py prices.sql wanted.json places.json
      - name: Load the prices
        run: npx wrangler d1 execute haniacart --remote --file prices.sql -y
